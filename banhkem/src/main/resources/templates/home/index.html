<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(~{::main})}">
<body>
<main>
    <style>
        .home-hero {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-glass-box {
            background: rgba(255, 255, 255, 0.75);
            padding: 4.5rem;
            border-radius: 60px;
            border: 3px dashed var(--primary-pink);
            text-align: center;
            backdrop-filter: blur(10px);
            max-width: 900px;
            box-shadow: 0 20px 50px rgba(255, 182, 193, 0.3);
        }
        .btn-pink-cute {
            background-color: var(--primary-pink) !important;
            color: var(--dark-brown) !important;
            font-weight: 800;
            padding: 20px 50px;
            border: none;
            font-size: 1.4rem;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
            transition: 0.3s;
        }
        .btn-pink-cute:hover {
            background-color: #ff99aa !important;
            transform: translateY(-5px);
            color: white !important;
        }
    </style>

    <div class="home-hero container">
        <div class="hero-glass-box shadow-lg">
            <h2 class="fw-bold mb-4" style="color: var(--dark-brown); letter-spacing: 5px; font-size: 3.5rem;">VỊ NGỌT NHÀ LÀM</h2>

            <p class="fs-4 mb-5 fw-bold" style="color: var(--dark-brown); line-height: 1.7;">
                Những chiếc bánh ngọt ngào nhất dành riêng cho bạn.<br>
                Hãy cùng Bunny Bakery tạo nên những kỷ niệm đáng nhớ!
            </p>

            <div class="d-flex justify-content-center gap-4 flex-wrap">
                <a href="/cake" class="btn btn-pink-cute rounded-pill">MUA SẮM NGAY</a>

                <a th:if="${#authentication.name == 'anonymousUser'}"
                   href="/auth/register" class="btn btn-pink-cute rounded-pill">ĐĂNG KÝ THÀNH VIÊN</a>

                <a th:unless="${#authentication.name == 'anonymousUser'}"
                   href="/order/history" class="btn btn-pink-cute rounded-pill">ĐƠN HÀNG CỦA TÔI</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>

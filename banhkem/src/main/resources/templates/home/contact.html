<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(~{::main})}">
<body>
<main class="container py-5">
    <style>
        .contact-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 2px dashed var(--primary-pink);
            padding: 3rem;
            margin-top: 50px;
        }
        .contact-icon {
            font-size: 3rem;
            color: var(--primary-pink);
            margin-bottom: 1.5rem;
        }
        .contact-title {
            font-family: 'Pacifico', cursive;
            color: var(--dark-brown);
            margin-bottom: 2rem;
        }
        .info-text {
            color: var(--dark-brown);
            font-weight: 700;
            font-size: 1.1rem;
        }
        /* Khung chứa bản đồ */
        .map-wrapper {
            border-radius: 30px;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: 450px;
            margin-top: 3rem;
            position: relative;
        }
        .btn-direction {
            background-color: var(--primary-pink);
            color: white;
            font-weight: 900;
            border-radius: 50px;
            padding: 12px 30px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: 0.3s;
            margin-top: 1rem;
            border: none;
        }
        .btn-direction:hover {
            background-color: var(--dark-brown);
            color: white;
            transform: scale(1.05);
        }
    </style>

    <div class="row justify-content-center">
        <div class="col-md-11 text-center contact-card shadow-lg">
            <h1 class="contact-title display-4">Liên hệ với Bunny Bakery</h1>
            <p class="lead mb-5 fw-bold" style="color: #6D4C41;">
                Chúng tớ luôn sẵn sàng lắng nghe những ý kiến đóng góp <br> và yêu cầu đặt bánh từ bạn!
            </p>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="p-4 rounded-4 bg-white shadow-sm h-100">
                        <i class="bi bi-telephone-heart contact-icon"></i>
                        <h5 class="fw-bold">HOTLINE</h5>
                        <p class="info-text">0123 456 789</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="p-4 rounded-4 bg-white shadow-sm h-100">
                        <i class="bi bi-envelope-paper-heart contact-icon"></i>
                        <h5 class="fw-bold">EMAIL</h5>
                        <p class="info-text">lehuuloc0929@gmail.com</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="p-4 rounded-4 bg-white shadow-sm h-100">
                        <i class="bi bi-geo-alt-fill contact-icon"></i>
                        <h5 class="fw-bold">ĐỊA CHỈ</h5>
                        <p class="info-text">201/2 Lê Văn Việt, Hiệp Phú, Thủ Đức, TP.HCM</p>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=201/2+Lê+Văn+Việt,+Hiệp+Phú,+Quận+9,+Thành+phố+Hồ+Chí+Minh"
                           target="_blank" class="btn-direction">
                            <i class="bi bi-cursor-fill me-2"></i> Chỉ đường đi
                        </a>
                    </div>
                </div>
            </div>

            <div class="map-wrapper">
                <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3918.5202410313885!2d106.77978257570414!3d10.847974457871625!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3175270f9012d90d%3A0xc375030ea6b636b1!2zMjAxLzIgTMSqIFbEg24gVmnhu4d0LCBIaeG7h3AgUGjDuiwgUXXhuq1uIDksIEjhu5MgQ2jDrSBNaW5oLCBWaeG7h3QgTmFt!5e0!3m2!1svi!2s!4v1715421234567!5m2!1svi!2s"
                        width="100%"
                        height="100%"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="mt-5 pt-4 border-top border-light">
                <p class="mb-0 fw-bold" style="color: var(--dark-brown);">
                    Giờ mở cửa: 08:00 AM - 09:00 PM (Hàng ngày)
                </p>
            </div>
        </div>
    </div>
</main>
</body>
</html>

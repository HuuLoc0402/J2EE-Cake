<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(~{::main})}">
<body>
<main class="container py-5">
    <style>
        .user-chat-container {
            max-width: 600px;
            height: calc(100vh - 160px);
            min-height: 550px;
            display: flex;
            flex-direction: column;
            border-radius: 40px !important;
            border: 4px dashed var(--primary-pink) !important;
            background: rgba(255, 255, 255, 0.9);
        }
        .chat-header-user {
            background-color: #dc3545;
            color: white;
            padding: 20px;
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
        }
        .message-bubble-user {
            max-width: 80%;
            border-radius: 25px !important;
            padding: 15px 20px;
            font-weight: 500;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .bg-user-sent { background-color: #dc3545 !important; color: white !important; }
        .bg-admin-reply { background-color: #ffffff !important; border: 1px solid #fdf2f4 !important; color: #212529 !important; }
        .back-home-btn {
            color: white; font-size: 1.5rem; transition: 0.3s; text-decoration: none;
        }
        .back-home-btn:hover { transform: scale(1.2); color: #ffccd5; }
        #chatBoxBodyUser::-webkit-scrollbar { width: 4px; }
        #chatBoxBodyUser::-webkit-scrollbar-thumb { background: #ffccd5; border-radius: 10px; }
    </style>

    <div class="card border-0 shadow-lg mx-auto user-chat-container overflow-hidden">
        <div class="chat-header-user text-center position-relative">
            <a href="/" class="back-home-btn position-absolute start-0 ms-4 top-50 translate-middle-y">
                <i class="bi bi-arrow-left-circle-fill"></i>
            </a>
            <h4 class="mb-0 fw-bold" style="font-family: 'Pacifico', cursive;">
                <i class="bi bi-chat-heart-fill me-2"></i>Hỗ trợ Bunny
            </h4>
        </div>

        <div id="chatBoxBodyUser" class="card-body p-4 flex-grow-1 overflow-y-auto" style="background: #fdf2f4;">
            <div id="userMessageArea" class="d-flex flex-column">
                <div th:each="msg : ${messages}" class="d-flex flex-column"
                     th:classappend="${msg.senderRole == 'ROLE_USER' ? 'align-items-end' : 'align-items-start'}">
                    <div class="message-bubble-user"
                         th:classappend="${msg.senderRole == 'ROLE_USER' ? 'bg-user-sent' : 'bg-admin-reply'}">
                        <p class="mb-0" th:text="${msg.content}"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-footer bg-white p-4 border-top">
            <div class="input-group shadow-sm rounded-pill overflow-hidden border border-danger p-1">
                <input type="text" id="userInp" class="form-control border-0 ps-4 shadow-none fs-5"
                       placeholder="Nhập nội dung cần Bunny giúp..." autocomplete="off"
                       onkeypress="if(event.key === 'Enter') window.sendUserWS()">
                <button class="btn btn-danger rounded-pill px-4" id="btnSendWS" onclick="window.sendUserWS()">
                    <i class="bi bi-send-fill fs-5"></i>
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        window.stompUser = null;

        window.sendUserWS = function() {
            const inp = document.getElementById('userInp');
            const content = inp ? inp.value.trim() : "";
            if (content && window.stompUser && window.stompUser.connected) {
                const m = {
                    content: content,
                    senderRole: 'ROLE_USER',
                    timestamp: new Date().toISOString()
                };
                window.stompUser.send("/app/chat.send", {}, JSON.stringify(m));
                window.renderUserMsg(m);
                inp.value = '';
            } else {
                if(!window.stompUser || !window.stompUser.connected) connectUserWS();
            }
        };

        window.renderUserMsg = function(m) {
            const area = document.getElementById('userMessageArea');
            if (!area) return;
            const isMe = m.senderRole === 'ROLE_USER';
            const html = `
                <div class="d-flex flex-column ${isMe ? 'align-items-end' : 'align-items-start'}">
                    <div class="message-bubble-user ${isMe ? 'bg-user-sent' : 'bg-admin-reply'}">
                        <p class="mb-0">${m.content}</p>
                    </div>
                </div>`;
            area.insertAdjacentHTML('beforeend', html);
            window.scrollChat();
        };

        window.scrollChat = function() {
            const b = document.getElementById('chatBoxBodyUser');
            if (b) b.scrollTop = b.scrollHeight;
        };

        function connectUserWS() {
            const socket = new SockJS('/ws-chat');
            window.stompUser = Stomp.over(socket);
            window.stompUser.debug = null;
            window.stompUser.connect({}, function () {
                window.stompUser.subscribe('/user/queue/messages', function (msg) {
                    window.renderUserMsg(JSON.parse(msg.body));
                });
            }, function(err) {
                setTimeout(connectUserWS, 5000);
            });
        }

        connectUserWS();
        setTimeout(window.scrollChat, 500);
    </script>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Bunny Bakery - Tiệm Bánh Ngọt Ngào</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root { --primary-pink: #FFB6C1; --dark-brown: #5D4037; --soft-pink: #FFD1DC; }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            margin: 0;
            background: url('/images/background.png') no-repeat center center fixed;
            background-size: cover;
        }

        /* NAVBAR ĐẦY ĐỦ LOGO VÀ LINKS */
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 4px solid var(--soft-pink);
            height: 110px;
            position: fixed;
            top: 0; width: 100%; z-index: 1050;
            display: flex; align-items: center;
        }

        .nav-container { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 0 40px; }
        .nav-side-links { width: 40%; display: flex; justify-content: space-evenly; align-items: center; }
        .logo-center { width: 20%; display: flex; flex-direction: column; align-items: center; position: relative; }

        .logo-wrapper {
            position: absolute; top: -55px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1060;
        }
        .logo-wrapper:hover { transform: scale(1.15); }
        .main-logo { height: 190px; width: auto; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); }

        .nav-link-custom {
            color: var(--dark-brown) !important;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.6rem;
            letter-spacing: 2px;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }
        .nav-link-custom:hover { color: var(--primary-pink) !important; transform: scale(1.1); }

        .app-container { display: flex; padding-top: 110px; min-height: 100vh; }

        /* SIDEBAR ADMIN CỐ ĐỊNH VỚI ĐẦY ĐỦ DANH MỤC QUẢN LÝ (CRUD) */
        #admin-sidebar {
            width: 280px;
            background: rgba(62, 39, 35, 0.98);
            position: fixed;
            top: 110px; left: 0; bottom: 0;
            z-index: 1000;
            border-right: 4px solid var(--primary-pink);
            overflow-y: auto;
            padding-bottom: 50px;
        }

        .admin-nav-link {
            padding: 15px 25px;
            color: white !important;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: 0.3s;
            border-radius: 15px;
            margin: 5px 15px;
        }
        .admin-nav-link:hover { background: var(--primary-pink); color: var(--dark-brown) !important; }
        .admin-nav-link i { margin-right: 15px; font-size: 1.3rem; color: var(--primary-pink); }
        .admin-nav-link:hover i { color: var(--dark-brown); }

        .main-content { flex: 1; padding: 40px; width: 100%; transition: 0.3s; }
        .is-admin-content { margin-left: 280px; }

        /* NÚT CHAT BONG BÓNG CHO KHÁCH */
        #chat-circle {
            position: fixed; bottom: 40px; right: 40px;
            width: 85px; height: 85px; border-radius: 50%;
            background-color: var(--primary-pink);
            color: white; display: flex; align-items: center; justify-content: center;
            z-index: 1040; box-shadow: 0 10px 25px rgba(255, 182, 193, 0.6);
            text-decoration: none; transition: 0.3s;
        }
        #chat-circle:hover { transform: scale(1.1) rotate(10deg); background-color: #ff99aa; }
        #chat-circle i { font-size: 3.5rem; }

        /* ĐỊNH DẠNG DROPDOWN NGƯỜI DÙNG */
        .dropdown-menu { border-radius: 25px; padding: 15px; border: 3px solid var(--soft-pink) !important; }
        .dropdown-item { border-radius: 15px; padding: 12px 20px !important; font-weight: 700; font-size: 1.1rem; }
        .dropdown-item:hover { background-color: var(--soft-pink); color: var(--dark-brown); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="nav-container">
        <div class="nav-side-links">
            <a class="nav-link-custom" href="/cake">BÁNH</a>
            <a class="nav-link-custom" href="/contact">LIÊN HỆ</a>
        </div>

        <div class="logo-center">
            <div class="logo-wrapper">
                <a href="/"><img th:src="@{/images/logo.png}" class="main-logo" alt="Logo"></a>
            </div>
        </div>

        <div class="nav-side-links">
            <a th:if="${!#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}"
               th:href="${#authentication.name == 'anonymousUser'} ? '/auth/login' : '/cart'" class="nav-link-custom">
                GIỎ HÀNG
            </a>

            <div class="dropdown">
                <button class="btn nav-link-custom dropdown-toggle border-0" data-bs-toggle="dropdown">
                    <span th:text="${#authentication.name == 'anonymousUser' ? 'ĐĂNG NHẬP' : #authentication.name}">USER</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow" style="min-width: 280px;">
                    <div th:if="${#authentication.name == 'anonymousUser'}">
                        <li><a class="dropdown-item" href="/auth/login"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</a></li>
                        <li><a class="dropdown-item" href="/auth/register"><i class="bi bi-person-plus me-2"></i>Đăng ký</a></li>
                    </div>

                    <div th:unless="${#authentication.name == 'anonymousUser'}">
                        <li><a class="dropdown-item fw-bold text-primary" href="/profile"><i class="bi bi-person-bounding-box me-2"></i>Hồ sơ cá nhân</a></li>

                        <li th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
                            <a class="dropdown-item" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Quản trị hệ thống</a>
                        </li>

                        <li th:if="${!#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
                            <a class="dropdown-item" href="/order/history"><i class="bi bi-clock-history me-2"></i>Lịch sử mua hàng</a>
                        </li>

                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="handleLogout()"><i class="bi bi-power me-2"></i>Đăng xuất</a></li>
                    </div>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="app-container">
    <aside id="admin-sidebar" th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
        <div class="py-4">
            <h6 class="text-uppercase fw-bold text-white fs-4 mb-4 px-4 border-bottom pb-3" style="letter-spacing: 2px;">Bunny Admin</h6>
            <nav class="nav flex-column">
                <a class="admin-nav-link" href="/admin/dashboard"><i class="bi bi-graph-up"></i> Thống kê</a>
                <a class="admin-nav-link" href="/admin/cakes"><i class="bi bi-cake2"></i> Quản lý Bánh</a>
                <a class="admin-nav-link" href="/admin/category"><i class="bi bi-tags"></i> Loại bánh</a>
                <a class="admin-nav-link" href="/admin/orders"><i class="bi bi-cart-check"></i> Đơn hàng</a>
                <a class="admin-nav-link" href="/admin/users"><i class="bi bi-people"></i> Người dùng</a>
                <a class="admin-nav-link" href="/admin/chats"><i class="bi bi-chat-dots"></i> Hỗ trợ Chat</a>
            </nav>
        </div>
    </aside>

    <main class="main-content" th:classappend="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'is-admin-content' : ''">
        <div th:replace="${content}"></div>
    </main>
</div>

<div th:if="${#authentication.name != 'anonymousUser' and !#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
    <a href="/chat" id="chat-circle">
        <i class="bi bi-chat-heart-fill"></i>
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function handleLogout() {
        document.cookie = "token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
        window.location.href = '/auth/login';
    }
</script>
</body>
</html>

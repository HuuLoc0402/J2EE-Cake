<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Bunny Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        :root { --primary-pink: #FFB6C1; --dark-brown: #5D4037; --soft-pink: #FFD1DC; }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            margin: 0;
            background: url('/images/background.png') no-repeat center center fixed;
            background-size: cover;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--soft-pink);
            height: 150px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1030;
        }

        .nav-container { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 0 50px; }
        .nav-side-links { width: 35%; display: flex; gap: 40px; align-items: center; }
        .logo-center { width: 30%; display: flex; flex-direction: column; align-items: center; }
        .main-logo { height: 90px; width: auto; }
        .store-name-text { font-family: 'Pacifico', cursive; color: var(--dark-brown); font-size: 1.5rem; line-height: 1; }

        .nav-link-custom {
            color: var(--dark-brown) !important;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 1.1rem;
        }
        .nav-link-custom:hover { color: var(--primary-pink) !important; }

        .app-container { display: flex; margin-top: 150px; min-height: calc(100vh - 150px); }

        #admin-sidebar {
            width: 260px;
            background: rgba(62, 39, 35, 0.9);
            color: white;
            position: fixed;
            top: 150px;
            left: 0;
            bottom: 0;
            z-index: 1020;
            border-right: 2px solid var(--soft-pink);
        }

        .main-content { flex: 1; padding: 30px; margin-left: 0; transition: 0.3s; }
        .is-admin-content { margin-left: 260px; }

        /* KHÔI PHỤC STYLE CHATBOX */
        #chat-circle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            z-index: 2000;
            cursor: pointer;
            background-color: var(--primary-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transition: 0.3s;
            border: none;
        }
        #chat-circle:hover { transform: scale(1.1); background-color: #ff99aa; }
        #chat-circle i { color: white; font-size: 2rem; }

        .dropdown-menu { border-radius: 15px; border: 2px solid var(--soft-pink); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="nav-container">
        <div class="nav-side-links">
            <a class="nav-link-custom" href="/cake">MENU</a>
            <a class="nav-link-custom" href="/contact">CONTACT</a>
        </div>

        <div class="logo-center">
            <a href="/"><img th:src="@{/images/logo.png}" class="main-logo" alt="Logo"></a>
            <div class="store-name-text">Bunny Bakery</div>
        </div>

        <div class="nav-side-links justify-content-end">
            <a th:if="${!#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}"
               th:href="${#authentication.name == 'anonymousUser'} ? '/auth/login' : '/cart'" class="nav-link-custom">
                GIỎ HÀNG <i class="bi bi-cart3"></i>
            </a>
            <div class="dropdown">
                <button class="btn nav-link-custom dropdown-toggle border-0" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle"></i>
                    <span th:text="${#authentication.name == 'anonymousUser' ? 'SIGN IN' : #authentication.name}">User</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                    <div th:if="${#authentication.name == 'anonymousUser'}">
                        <li><a class="dropdown-item fw-bold" href="/auth/login">Đăng nhập</a></li>
                        <li><a class="dropdown-item fw-bold" href="/auth/register">Đăng ký</a></li>
                    </div>
                    <div th:unless="${#authentication.name == 'anonymousUser'}">
                        <li th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
                            <a class="dropdown-item" href="/admin/dashboard">Quản trị cửa hàng</a>
                        </li>
                        <li th:if="${!#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
                            <a class="dropdown-item" href="/order/history">Lịch sử mua hàng</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="handleLogout()">Đăng xuất</a></li>
                    </div>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="app-container">
    <nav id="admin-sidebar" th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
        <div class="p-3">
            <h6 class="text-uppercase fw-bold text-muted small mb-3">Hệ thống Admin</h6>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link py-3" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i> Thống kê</a></li>
                <li class="nav-item"><a class="nav-link py-3" href="/admin/chats"><i class="bi bi-chat-dots me-2"></i> Hỗ trợ khách</a></li>
                <li class="nav-item"><a class="nav-link py-3" href="/admin/category"><i class="bi bi-tags me-2"></i> Danh mục</a></li>
                <li class="nav-item"><a class="nav-link py-3" href="/admin/cakes"><i class="bi bi-cake2 me-2"></i> Bánh kem</a></li>
                <li class="nav-item"><a class="nav-link py-3" href="/admin/users"><i class="bi bi-people me-2"></i> Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link py-3" href="/admin/orders"><i class="bi bi-bag-check me-2"></i> Đơn hàng</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content" th:classappend="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'is-admin-content' : ''">
        <div th:replace="${content}"></div>
    </div>
</div>

<div th:if="${#authentication.name != 'anonymousUser' and !#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
    <div id="chat-circle" class="shadow-lg">
        <i class="bi bi-chat-heart-fill"></i>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    // Khôi phục logic click mở trang Chat
    const cCircle = document.getElementById('chat-circle');
    if (cCircle) {
        cCircle.onclick = () => { window.location.href = '/chat'; };
    }

    function handleLogout() {
        document.cookie = "token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
        window.location.href = '/auth/login';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Bunny Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root { --primary-pink: #FFB6C1; --dark-brown: #5D4037; --box-bg: #FFD1DC; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: url('/images/background.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh; display: flex; flex-direction: column; margin: 0;
        }
        .auth-header { background: rgba(255, 255, 255, 0.9); height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 3px solid black; }
        .auth-logo { height: 80px; }
        .auth-store-name { font-family: 'Pacifico', cursive; color: var(--dark-brown); font-size: 1.4rem; }
        .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; }
        .auth-box {
            background: var(--box-bg);
            border: 2px dashed var(--dark-brown);
            border-radius: 20px;
            padding: 30px 40px;
            width: 480px;
            height: 550px;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .auth-title { text-align: center; font-weight: 800; color: var(--dark-brown); margin-bottom: 15px; font-size: 2rem; }
        .form-label { font-weight: 700; color: var(--dark-brown); width: 130px; margin-bottom: 0; font-size: 0.9rem; }
        .input-group-custom { display: flex; align-items: center; margin-bottom: 10px; }
        .form-control { border-radius: 50px; border: none; padding: 7px 18px; background: #FFF0F5; flex: 1; font-size: 0.9rem; }
        .btn-red { background: #dc3545; color: white; font-weight: 800; border-radius: 50px; padding: 12px; border: none; width: 100%; margin-top: auto; transition: 0.3s; }
        .btn-red:hover { background: #bb2d3b; transform: scale(1.02); }
        .btn-outline { background: white; color: #6c757d; font-weight: 800; border-radius: 50px; padding: 8px; border: 1px solid #6c757d; width: 100%; margin-top: 8px; text-decoration: none; text-align: center; font-size: 0.9rem; }
        .footer-text { text-align: center; margin-top: 8px; font-size: 0.85rem; }
        .footer-text a { color: var(--dark-brown); font-weight: 700; text-decoration: underline; }
        .address-text { position: fixed; bottom: 20px; right: 40px; font-weight: 700; color: var(--dark-brown); }
    </style>
</head>
<body>
<div class="auth-header">
    <a href="/"><img th:src="@{/images/logo.png}" class="auth-logo"></a>
    <div class="auth-store-name">Bunny Bakery</div>
</div>
<div class="auth-container">
    <div class="auth-box shadow">
        <h2 class="auth-title">Đăng ký</h2>
        <form id="registerForm" style="flex: 1; display: flex; flex-direction: column;">
            <div class="input-group-custom">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="input-group-custom">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <div class="input-group-custom">
                <label class="form-label">Họ tên</label>
                <input type="text" id="fullName" class="form-control" required>
            </div>
            <div class="input-group-custom">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="input-group-custom">
                <label class="form-label">Số điện thoại</label>
                <input type="tel" id="phone" class="form-control" required>
            </div>
            <div class="input-group-custom">
                <label class="form-label">Địa chỉ</label>
                <input type="text" id="address" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-red">TẠO TÀI KHOẢN</button>
            <a href="/" class="btn btn-outline">Quay lại trang chủ</a>
            <div class="footer-text">
                <span>Đã có tài khoản? </span><a href="/auth/login">Đăng nhập ngay</a>
            </div>
        </form>
    </div>
</div>
<div class="address-text">Ho Chi Minh City, Viet Nam</div>
<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value
        };
        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (response.ok) {
                alert("Đăng ký thành công!");
                window.location.href = "/auth/login";
            } else {
                const err = await response.json();
                alert("Lỗi: " + (err.message || "Tài khoản đã tồn tại!"));
            }
        } catch (error) { alert("Không thể kết nối đến máy chủ!"); }
    });
</script>
</body>
</html>

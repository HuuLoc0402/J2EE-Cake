<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Bunny Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root { --primary-pink: #FFB6C1; --dark-brown: #5D4037; --box-bg: #FFD1DC; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: url('/images/background.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh; display: flex; flex-direction: column; margin: 0;
        }
        .auth-header { background: rgba(255, 255, 255, 0.95); height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 4px solid var(--primary-pink); }
        .auth-logo { height: 100px; }
        .auth-store-name { font-family: 'Pacifico', cursive; color: var(--dark-brown); font-size: 2rem; margin-top: 5px; }

        .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 50px 0; }

        /* CỐ ĐỊNH KÍCH THƯỚC KHUNG */
        .auth-box {
            background: var(--box-bg);
            border: 4px dashed var(--dark-brown);
            border-radius: 40px;
            padding: 60px;
            width: 600px;
            min-height: 700px;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }
        .auth-title { text-align: center; font-weight: 900; color: var(--dark-brown); margin-bottom: 50px; font-size: 3.5rem; font-family: 'Pacifico', cursive; }

        .form-label { font-weight: 800; color: var(--dark-brown); width: 170px; margin-bottom: 0; font-size: 1.2rem; }
        .input-group-custom { display: flex; align-items: center; margin-bottom: 35px; }

        .form-control {
            border-radius: 50px; border: 3px solid transparent; padding: 15px 25px;
            background: #FFF0F5; flex: 1; font-size: 1.1rem; font-weight: 700;
            transition: 0.3s;
        }
        .form-control:focus { border-color: var(--primary-pink); box-shadow: none; outline: none; background: white; }

        .btn-red { background: #dc3545; color: white; font-weight: 900; border-radius: 50px; padding: 20px; border: none; width: 100%; font-size: 1.4rem; transition: 0.3s; margin-top: auto; }
        .btn-red:hover { background: #bb2d3b; transform: scale(1.05); box-shadow: 0 10px 20px rgba(220, 53, 69, 0.3); }

        .btn-outline { background: white; color: var(--dark-brown); font-weight: 800; border-radius: 50px; padding: 12px; border: 2px solid var(--dark-brown); width: 100%; margin-top: 15px; text-decoration: none; text-align: center; font-size: 1.1rem; }

        .footer-text { text-align: center; margin-top: 30px; font-size: 1.2rem; }
        .footer-text a { color: var(--dark-brown); font-weight: 800; text-decoration: underline; }

        .address-text { position: fixed; bottom: 30px; right: 40px; font-weight: 800; color: var(--dark-brown); font-size: 1.1rem; }
    </style>
</head>
<body>
<div class="auth-header">
    <a href="/"><img th:src="@{/images/logo.png}" class="auth-logo"></a>
    <div class="auth-store-name">Bunny Bakery</div>
</div>
<div class="auth-container">
    <div class="auth-box shadow">
        <h2 class="auth-title">Đăng nhập</h2>
        <form id="loginForm" style="flex: 1; display: flex; flex-direction: column;">
            <div class="input-group-custom">
                <label class="form-label">Tài khoản</label>
                <input type="text" id="username" class="form-control" placeholder="Tên đăng nhập..." required>
            </div>
            <div class="input-group-custom">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Mật khẩu..." required>
            </div>
            <button type="submit" class="btn btn-red text-uppercase">Đăng nhập ngay</button>
            <a href="/" class="btn btn-outline">Quay lại trang chủ</a>
            <div class="footer-text">
                <a href="/auth/register">Chưa có tài khoản? Đăng ký ngay</a>
            </div>
        </form>
    </div>
</div>
<div class="address-text">Ho Chi Minh City, Viet Nam</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            if (response.ok) {
                const result = await response.json();
                document.cookie = `token=${result.token}; path=/; max-age=86400; SameSite=Lax`;
                window.location.href = '/';
            } else { alert('Sai tài khoản hoặc mật khẩu!'); }
        } catch (error) { alert("Không thể kết nối đến máy chủ!"); }
    });
</script>
</body>
</html>

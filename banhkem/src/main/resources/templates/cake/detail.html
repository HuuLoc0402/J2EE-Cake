<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(~{::main})}">
<head>
    <meta charset="UTF-8">
</head>
<body>
<main class="container py-5">
    <style>
        .detail-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 25px !important;
            border: 2px dashed var(--primary-pink) !important;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.2);
        }

        .img-container {
            border-radius: 15px;
            overflow: hidden;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            height: 550px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fdfdfd;
        }

        .cake-title {
            font-family: 'Pacifico', cursive;
            color: var(--dark-brown);
            font-size: 3.5rem;
            margin-bottom: 5px;
        }

        .category-text {
            color: #ff4d6d;
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: block;
        }

        .price-tag {
            color: #d63384;
            font-weight: 900;
            font-size: 3rem;
        }

        .info-box {
            background: rgba(255, 240, 245, 0.8);
            border-radius: 15px;
            padding: 20px;
            border-left: 5px solid var(--primary-pink);
            margin-bottom: 30px;
        }

        .btn-bunny-main {
            background: var(--primary-pink) !important;
            color: var(--dark-brown) !important;
            font-weight: 800;
            border-radius: 50px;
            padding: 18px;
            border: none;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
            transition: 0.3s;
        }

        .btn-bunny-main:hover {
            background: #ff99aa !important;
            transform: scale(1.02);
        }

        .btn-bunny-outline {
            background: white !important;
            color: var(--dark-brown) !important;
            border: 2px solid var(--primary-pink) !important;
            font-weight: 800;
            border-radius: 50px;
            padding: 18px;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-selector {
            background: white;
            border-radius: 50px;
            border: 2px solid var(--soft-pink);
            padding: 10px 20px;
        }
    </style>

    <div class="card detail-card p-4 p-lg-5 shadow-lg">
        <div class="row g-5 align-items-center">
            <div class="col-md-6">
                <div class="img-container">
                    <img th:src="${cake.image != null ? cake.image : '/images/default-cake.jpg'}"
                         alt="Sản phẩm Bunny Bakery">
                </div>
            </div>

            <div class="col-md-6">
                <div class="mb-4">
                    <h1 class="cake-title" th:text="${cake.name}">Tên bánh kem</h1>
                    <span class="category-text">
                        <i class="bi bi-heart-fill me-1"></i>
                        <span th:text="${cake.category != null ? cake.category.name : 'Homemade'}"></span>
                    </span>
                    <div class="price-tag mb-3"
                         th:text="${#numbers.formatDecimal(cake.price != null ? cake.price : 0, 0, 'COMMA', 0, 'POINT') + 'đ'}">
                    </div>
                </div>

                <div class="info-box">
                    <h6 class="fw-bold text-muted small text-uppercase mb-2">Mô tả sản phẩm</h6>
                    <p class="mb-0 text-dark fs-5" th:text="${cake.description}">Thông tin chi tiết về hương vị và nguyên liệu...</p>
                </div>

                <div class="row g-3 mb-4 text-center">
                    <div class="col-6">
                        <div class="p-3 border rounded-4 bg-white shadow-sm h-100">
                            <i class="bi bi-box-seam-fill text-primary fs-3"></i>
                            <div class="small fw-bold mt-1 text-uppercase">Tình trạng</div>
                            <div th:if="${cake.stockQuantity > 0}">
                                <strong class="text-success">CÒN HÀNG</strong>
                                <div class="text-muted small fw-bold mt-1" th:text="'(Kho còn: ' + ${cake.stockQuantity} + ')'"></div>
                            </div>
                            <div th:unless="${cake.stockQuantity > 0}">
                                <strong class="text-danger">HẾT HÀNG</strong>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-3 border rounded-4 bg-white shadow-sm h-100">
                            <i class="bi bi-truck text-danger fs-3"></i>
                            <div class="small fw-bold mt-1 text-uppercase">Giao hàng</div>
                            <strong class="text-dark">MIỄN PHÍ</strong>
                            <div class="text-muted small fw-bold mt-1">Bán kính 5km</div>
                        </div>
                    </div>
                </div>

                <form th:action="@{/cart/add}" method="post" id="addToCartForm">
                    <input type="hidden" name="cakeId" th:value="${cake.id}">

                    <div class="d-flex align-items-center justify-content-between mb-4 qty-selector shadow-sm" th:if="${cake.stockQuantity > 0}">
                        <span class="fw-bold text-muted">Số lượng mua:</span>
                        <div class="d-flex align-items-center gap-4">
                            <span class="qty-btn" style="cursor:pointer; font-size: 1.5rem; color: #ff4d6d; font-weight: bold;" onclick="adjustQty(-1)">-</span>
                            <input type="number" id="quantity" name="quantity"
                                   class="form-control text-center border-0 bg-transparent fw-bold fs-4 p-0"
                                   value="1" min="1" th:max="${cake.stockQuantity}" readonly style="width: 50px;">
                            <span class="qty-btn" style="cursor:pointer; font-size: 1.5rem; color: #ff4d6d; font-weight: bold;" onclick="adjustQty(1)">+</span>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <button type="submit" class="btn btn-bunny-main w-100 shadow" th:disabled="${cake.stockQuantity <= 0}">
                                <i class="bi bi-cart-plus-fill me-2"></i> THÊM GIỎ HÀNG
                            </button>
                        </div>
                        <div class="col-6">
                            <a th:href="@{/cake}" class="btn btn-bunny-outline w-100">
                                <i class="bi bi-house-heart me-2"></i> TRANG CHỦ
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function adjustQty(amount) {
            const qtyInput = document.getElementById('quantity');
            const maxQuantity = [[${cake.stockQuantity}]];
            let currentVal = parseInt(qtyInput.value) || 1;
            let newVal = currentVal + amount;
            if (newVal >= 1 && newVal <= maxQuantity) {
                qtyInput.value = newVal;
            } else if (newVal > maxQuantity) {
                alert("Rất tiếc, Bunny chỉ còn " + maxQuantity + " chiếc thôi ạ!");
            }
        }
    </script>
</main>
</body>
</html>
